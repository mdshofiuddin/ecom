version: '3.8'

services:
  apexstore:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apexstore_ecommerce
    restart: unless-stopped
    ports:
      - "3000:10000"
    environment:
      - NODE_ENV=production
      - PORT=10000
      # WARNING: Always override SESSION_SECRET via .env file or environment variable in production
      - SESSION_SECRET=${SESSION_SECRET:-change_this_to_a_secure_random_key_in_production}
      - DB_PATH=/app/data/store.db
    volumes:
      - store_data:/app/data

volumes:
  store_data:
